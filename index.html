<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Coffee – Voice Assistant</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <div>
    <h1>Coffee ☕</h1>
    <div class="sub"><span id="dot" class="dot"></span><span id="conn">Connecting…</span></div>
  </div>
  <label class="tog"><input type="checkbox" id="vox" checked> Speak replies</label>
</header>

<div id="log" aria-live="polite"></div>
<div class="chips" id="chips"></div>

<div class="stage">
  <button id="mic" aria-label="Tap to talk">🎙️</button>
  <div id="state">Tap the mic and speak</div>
</div>

<form id="f">
  <input id="txt" placeholder="…or type a command" autocomplete="off">
  <button class="send">Send</button>
</form>

<script src="app.js"></script>
</body>
</html>
